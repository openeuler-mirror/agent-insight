# 从当前源码构建 Web 和 Storage Core，并部署必需的 ClickHouse。
# 设置 CLICKHOUSE_PASSWORD 后执行：
#   docker compose -f docker-compose.source.yml up -d --build
# 源码更新后重新执行相同命令；独立数据卷在停止服务后保留。
services:
  core-volume-init:
    extends:
      file: docker-compose.storage-core.yml
      service: core-volume-init
  clickhouse:
    extends:
      file: docker-compose.storage-core.yml
      service: clickhouse
  storage-core:
    extends:
      file: docker-compose.storage-core.yml
      service: storage-core
  agent-insight:
    extends:
      file: docker-compose.storage-core.yml
      service: agent-insight

volumes:
  clickhouse-data:
  core-data:
  web-data:
