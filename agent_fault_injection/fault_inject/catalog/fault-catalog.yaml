# Fault-mode table presentation for Web UI (/api/faults).
# Skills are discovered from skills/*/SKILL.md. This file controls labels,
# order, visibility, and optional multi-scenario display overrides.
#
# Fields per fault entry:
#   id        (required) — directory name under skills/
#   label_zh  (optional) — Chinese display name; falls back to SKILL.md H1 / id
#   label_en  (optional) — English/id display; defaults to id
#   visible   (optional) — if false, hide from the table (default true)
#   platforms (optional) — supported platforms; default [opencode, xiaoo]
#   submodes  (optional) — only needed for multi-scenario faults when you want
#                          custom name/description in the table. Omit entirely
#                          when there is no (or only one) child scenario; the
#                          UI then uses SKILL.md. Do not write an empty list.
#     name         (required)
#     description  (optional)
#     id           (optional) — defaults to same-index scene id from SKILL.md
#     visible      (optional)

injection_methods:
  skill_inject: Skill 注入
  file_tamper: 文件篡改
  prompt_modify: 提示词修改
  tool_result_tamper: 工具结果篡改
  intercept_rewrite: 拦截改写
  route_manipulate: 路由操纵（预留）

faults:
  - id: analysis-paralysis
    label_zh: 过度思考
    label_en: analysis-paralysis

  - id: thinking-dead-loop
    label_zh: 思考死循环
    label_en: thinking-dead-loop
    submodes:
      - name: 字面重复死循环
        description: 「让我协助」字面高速堆叠
      - name: 逻辑死循环
        description: 语义相近、措辞微调的「先看上下文」废话
      - name: 计划-执行死循环
        description: 碎片化分析与计划来回交错、无实质执行

  - id: tool_repeat_dead_loop
    label_zh: 工具重复死循环
    label_en: tool_repeat_dead_loop
    submodes:
      - name: generic_repeat
        description: 相同工具+参数重复，仅告警不中断
      - name: unknown_tool_repeat
        description: 未知工具重复，工具返回错误
      - name: global_breaker
        description: 全局断路器兜底中断
      - name: ping_pong
        description: 两工具交替调用

  - id: ras-early-stop
    label_zh: 提前停止
    label_en: ras-early-stop

  - id: step-omission
    label_zh: 步骤遗漏
    label_en: step-omission

  - id: step-order-error
    label_zh: 步骤顺序错误
    label_en: step-order-error

  - id: tool-selection-error
    label_zh: 工具选择错误
    label_en: tool-selection-error

  - id: tool-argument-error
    label_zh: 工具参数错误
    label_en: tool-argument-error
    platforms: [opencode]

  - id: planning-logic-error
    label_zh: 规划逻辑错误
    label_en: Planning Logic Error
    submodes:
      - name: 依赖颠倒
        description: 子任务依赖方向写反，后置内容清单被当作前置条件
      - name: 环依赖
        description: 子任务互相作为前置，形成无法收敛的依赖环
      - name: 步骤缺失
        description: 计划漏掉写/读源文件，却要求写出内嵌其正文的内容清单

  - id: unverified-success
    label_zh: 虚假成功
    label_en: unverified-success

  - id: execution-goal-drift
    label_zh: 执行目标漂移
    label_en: execution-goal-drift

  - id: memory-noise-interference
    label_zh: 记忆噪声干扰
    label_en: memory-noise-interference
    submodes:
      - name: 无关历史噪声
        description: 伪造旧会话会议室/团建记忆，干扰真实评审预订决策
      - name: 冲突事实噪声
        description: 内网冻结汇率与正确中间价互斥，诱导采信错误换算
      - name: 错误响应噪声
        description: 冗长工具失败日志中的伪字段锚定 HTTP 状态码选择

  - id: memory-file-loss
    label_zh: 记忆文件丢失
    label_en: memory-file-loss
    platforms: [opencode, xiaoo]
    submodes:
      - name: 删除全文
        description: 播种 MEMORY.md 后删除整份文件
      - name: 删除约束段
        description: 保留文件但删除 ## 约束 段

  - id: tool-result-corruption
    label_zh: 工具结果篡改
    label_en: tool-result-corruption
    platforms: [opencode, xiaoo]

  - id: prompt-system-override
    label_zh: 提示词修改（System 覆盖）
    label_en: prompt-system-override
    platforms: [opencode, xiaoo]

  - id: interception-history-inject
    label_zh: 拦截改写（历史注入）
    label_en: interception-history-inject
    platforms: [opencode, xiaoo]

  - id: interception-assistant-corruption
    label_zh: 拦截改写（助手文本）
    label_en: interception-assistant-corruption
    platforms: [opencode, xiaoo]
