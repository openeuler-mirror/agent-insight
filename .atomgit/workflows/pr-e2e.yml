    env:
      E2E_EXPECTED_SHA: ${{ jobs.build.outputs.tested_sha }}
    steps:
      - name: Checkout pinned source
        uses: checkout
        with:
          ref: ${{ jobs.build.outputs.tested_sha || atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          fetch-depth: 1

      - name: Prepare isolated job
        shell: bash
        run: |
          set -euo pipefail
          node test/e2e/control/actions-job.mjs --phase collect \
            --run-id "atomgit-${ATOMGIT_RUN_ID:?}"

      - name: Download e2e-result-build
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-build
          path: ${{ env.E2E_CI_ROOT }}/inputs/build

      - name: Download e2e-result-ut
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-ut
          path: ${{ env.E2E_CI_ROOT }}/inputs/ut

      - name: Download e2e-result-001
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-001
          path: ${{ env.E2E_CI_ROOT }}/inputs/001

      - name: Download e2e-result-002
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-002
          path: ${{ env.E2E_CI_ROOT }}/inputs/002

      - name: Download e2e-result-003
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-003
          path: ${{ env.E2E_CI_ROOT }}/inputs/003

      - name: Download e2e-result-004
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-004
          path: ${{ env.E2E_CI_ROOT }}/inputs/004

      - name: Download e2e-result-005
        if: ${{ always() }}
        continue-on-error: true
        uses: download-artifact
        with:
          name: e2e-result-005
          path: ${{ env.E2E_CI_ROOT }}/inputs/005

      - name: Collect all results and enforce gate
        id: phase
        shell: bash
        if: ${{ always() }}
        env:
          E2E_JOB_RESULTS_JSON: >-
            {"build":"${{ jobs.build.result }}","ut":"${{ jobs.ut.result }}","001":"${{ jobs.case_001.result }}","002":"${{ jobs.case_002.result }}","003":"${{ jobs.case_003.result }}","004":"${{ jobs.case_004.result }}","005":"${{ jobs.case_005.result }}"}
        run: |
          set -euo pipefail
          cd "${E2E_CI_SOURCE:?}"
          node test/e2e/control/actions-phase.mjs --phase collect \
            --project "$E2E_CI_SOURCE" --root "$E2E_CI_ROOT" \
            --run-id "$E2E_CI_RUN_ID" --tested-sha "$E2E_CI_TESTED_SHA"

      - name: Upload public phase reports
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: pr-e2e
          if-no-files-found: error
          path: |
            ${{ env.E2E_CI_ROOT }}/public/context.json
            ${{ env.E2E_CI_ROOT }}/public/result.json
            ${{ env.E2E_CI_ROOT }}/public/report.json
            ${{ env.E2E_CI_ROOT }}/public/report.html
            ${{ env.E2E_CI_ROOT }}/public/summary.md
