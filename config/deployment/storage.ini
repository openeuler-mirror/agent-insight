# App 的数据库连接配置。在启动 app 前直接编辑本文件；启动数据库时不会读取它。
[transaction]
backend = @instance
# 默认跟随本实例启动的事务库（默认 PostgreSQL）。外部库填写 postgresql、opengauss 或 sqlite。
# 下面只需修改所选事务库的段落，以及必选的 [clickhouse]。

[postgresql]
host = postgres
# App 容器访问 PostgreSQL 的主机名。跨服务器部署时填写数据库地址。
port = 5432
# 数据库的服务端口；同一 Docker 网络内使用容器内部端口。
database = agent_insight
# 数据库名。
user = agent_insight
# 登录数据库的用户名。
password = @instance
# 默认读取本实例的密码。连接外部账号时直接填写该账号的实际密码。
schema = agent_insight
# 业务表所在的 schema。
sslmode = disable
# 默认使用本机容器网络。外部 TLS 服务可改为 verify-full，并设置下方 CA 路径。
# sslrootcert = /run/certs/database-ca.pem

[opengauss]
host = opengauss
# openGauss 的服务地址。
port = 5432
# 数据库端口。
database = agent_insight
# 数据库名。
user = agent_insight
# 登录用户名。
password = @instance
# 默认使用本实例的 openGauss 密码，外部库填写实际密码。
schema = agent_insight
# 业务 schema。
sslmode = disable
# 跨机 TLS 连接可改为 verify-full，并设置容器内可读的 sslrootcert。

[sqlite]
endpoint = http://sqlite:8080
# SQLite 网络服务地址。跨机时填写受信任的 HTTPS 地址。
token = @instance
# 默认使用本实例的 SQLite 服务令牌，外部服务填写实际令牌。

[clickhouse]
endpoint = http://clickhouse:8123
# 从 App 访问 ClickHouse 的 HTTP(S) 地址。
database = agent_insight
# 存储分析数据的数据库名。
user = agent_insight
# 登录 ClickHouse 的用户名。
password = @instance
# 默认使用本实例的 ClickHouse 密码，外部库填写实际密码。
