[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-insight-copaw"
version = "0.2.0"
description = "CoPaw (QwenPaw) trace collector plugin for AgentInsight"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AgentInsight Team" }]
dependencies = []

[project.scripts]
agent-insight-copaw = "copaw.cli:main"

[tool.setuptools]
packages = ["copaw", "copaw._plugin_assets"]

[tool.setuptools.package-data]
"copaw" = ["_plugin_assets/*"]
