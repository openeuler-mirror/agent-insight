services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: agent_insight
      CLICKHOUSE_USER: agent_insight
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${CH_HOST_PORT:-18123}:8123"
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --host 127.0.0.1 --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --database "$$CLICKHOUSE_DB" --query 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  ch-data:
